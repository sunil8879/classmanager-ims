<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Explorer | ClassManager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --aqua: #7FFFD4; --black: #000000; --white: #FFFFFF; }
        body { background-color: var(--black); color: var(--white); font-family: sans-serif; }
        .header-bar { border-bottom: 3px solid var(--aqua); padding: 20px; margin-bottom: 20px; }
        .table-selector { background: #111; border: 2px solid var(--aqua); border-radius: 10px; color: var(--aqua); padding: 12px; width: 100%; font-weight: bold; }
        th { background: var(--aqua) !important; color: black !important; text-transform: uppercase; font-size: 12px; }
        td { font-size: 13px; border-color: #333 !important; color: white !important; }
        #debug-status { color: #ffc107; font-size: 12px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="header-bar">
    <h3 class="fw-bold text-uppercase" style="color: var(--aqua);">DATABASE EXPLORER</h3>
    <!-- THIS IS THE MISSING ELEMENT THAT CAUSED THE ERROR -->
    <div id="debug-status">Initializing connection...</div>
</div>

<div class="container-fluid py-4">
    <div class="row mb-4">
        <div class="col-md-6">
            <label class="text-aqua small fw-bold">SELECT TABLE</label>
            <select id="tableDropdown" class="table-selector" onchange="loadTableData(this.value)">
                <option value="">-- Loading Tables... --</option>
            </select>
        </div>
    </div>

    <div class="table-responsive" style="max-height: 75vh; border: 1px solid var(--aqua); border-radius: 10px;">
        <table class="table table-dark table-hover mb-0">
            <thead id="tHead"></thead>
            <tbody id="tBody">
                <tr><td class="p-5 text-center text-muted">Select a table from the dropdown above.</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // 1. UPDATE YOUR CREDENTIALS HERE
    const _url = 'https://classmanager-api.sunilvasarkar1975.workers.dev';
    const _key = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVyendpam5sYm53amRsbHV2eHlrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEyNTkzMDgsImV4cCI6MjA4NjgzNTMwOH0.H8c9tT5HsxeL4xJAM9KrKmb1v6KKO8dZ-NOB-Pz2G2k';
    const client = window.supabase.createClient(_url, _key);

    // 2. GET LOGIN ID
    const myID = localStorage.getItem('institute_id') || sessionStorage.getItem('institute_id');

    async function init() {
        const status = document.getElementById('debug-status');
        const dropdown = document.getElementById('tableDropdown');

        if (!myID) {
            status.innerText = "❌ ERROR: Login ID not found. Please log in again.";
            return;
        }

        status.innerText = "Connected. Fetching table list...";

        // Call the RPC function to get tables
        const { data, error } = await client.rpc('get_all_tables');
        
        if (error) {
            status.innerText = "❌ ERROR: Could not fetch tables. Ensure the SQL RPC function is created.";
            console.error(error);
            return;
        }

        dropdown.innerHTML = '<option value="">-- Select a Table --</option>';
        data.forEach(t => {
            const opt = document.createElement('option');
            opt.value = t.table_name;
            opt.innerText = t.table_name;
            dropdown.appendChild(opt);
        });
        status.innerText = `Ready. Logged in as: ${myID}`;
    }

    async function loadTableData(tableName) {
        if (!tableName) return;
        
        const head = document.getElementById('tHead');
        const body = document.getElementById('tBody');
        const status = document.getElementById('debug-status');

        head.innerHTML = "";
        body.innerHTML = '<tr><td class="text-center p-5"><div class="spinner-border text-info"></div><br>Fetching...</td></tr>';

        try {
            const { data, error } = await client.from(tableName).select('*').limit(100);

            if (error) {
                body.innerHTML = `<tr><td class="p-5 text-center text-danger">Database Error: ${error.message}</td></tr>`;
                return;
            }

            if (!data || data.length === 0) {
                body.innerHTML = '<tr><td class="p-5 text-center text-muted">This table is currently empty.</td></tr>';
                return;
            }

            // FILTER LOGIC
            const cols = Object.keys(data[0]);
            let filtered = data;
            if (cols.includes('institute_id')) {
                filtered = data.filter(row => String(row.institute_id) === String(myID));
            }

            // RENDER HEADERS
            head.innerHTML = `<tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr>`;

            // RENDER ROWS
            if (filtered.length > 0) {
                body.innerHTML = filtered.map(row => `
                    <tr>${cols.map(c => `<td>${row[c] !== null ? row[c] : '-'}</td>`).join('')}</tr>
                `).join('');
                status.innerText = `Viewing ${tableName} | Found ${filtered.length} matches for ${myID}`;
            } else {
                body.innerHTML = `<tr><td class="p-5 text-center text-warning">Table has data, but 0 records match your ID: ${myID}</td></tr>`;
            }

        } catch (err) {
            body.innerHTML = `<tr><td class="p-5 text-center text-danger">JS Error: ${err.message}</td></tr>`;
        }
    }

    window.onload = init;
</script>
</body>
</html>

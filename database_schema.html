<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Explorer | ClassManager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --aqua: #7FFFD4; --black: #000000; --white: #FFFFFF; }
        body { background-color: var(--black); color: var(--white); font-family: sans-serif; text-align: left; margin: 0; }
        .header-bar { border-bottom: 3px solid var(--aqua); padding: 15px; background: #000; position: sticky; top: 0; z-index: 100; }
        .table-selector { background: #111; border: 2px solid var(--aqua); border-radius: 10px; color: var(--aqua); padding: 12px; width: 100%; font-weight: bold; }
        th { background: var(--aqua) !important; color: black !important; text-transform: uppercase; font-size: 11px; padding: 10px !important; }
        td { font-size: 13px; border-color: #333 !important; color: white !important; white-space: nowrap; padding: 8px !important; }
        #debug-status { color: #ffc107; font-size: 11px; margin-top: 5px; }
        .table-responsive { max-height: 75vh; border: 1px solid var(--aqua); border-radius: 10px; margin-top: 20px; }
    </style>
</head>
<body>

<div class="header-bar">
    <h5 class="fw-bold text-uppercase m-0" style="color: var(--aqua);">🗄️ DATABASE EXPLORER</h5>
    <div id="debug-status">Initializing Cloudflare Bridge...</div>
</div>

<div class="container-fluid py-3">
    <div class="row g-3">
        <div class="col-12">
            <label class="text-aqua small fw-bold mb-1">SELECT TABLE</label>
            <select id="tableDropdown" class="table-selector" onchange="loadTableData(this.value)">
                <option value="">-- Loading Tables... --</option>
            </select>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-dark table-hover mb-0">
            <thead id="tHead"></thead>
            <tbody id="tBody">
                <tr><td class="p-5 text-center text-muted">Select a table to see live records.</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // 1. Ensure these are your ACTUAL credentials from Supabase Settings -> API
    const _supabaseUrl = 'https://classmanager-api.sunilvasarkar1975.workers.dev';
    const _supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVyendpam5sYm53amRsbHV2eHlrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEyNTkzMDgsImV4cCI6MjA4NjgzNTMwOH0.H8c9tT5HsxeL4xJAM9KrKmb1v6KKO8dZ-NOB-Pz2G2k';
    
    const { createClient } = supabase;
    const client = createClient(_supabaseUrl, _supabaseKey);

    async function loadTableList() {
        const dropdown = document.getElementById('tableDropdown');
        
        // Call the SQL function we created in Step 1
        const { data, error } = await client.rpc('get_all_tables');
        
        if (error) {
            console.error(error);
            alert("Connection Error: " + error.message);
            dropdown.innerHTML = '<option>Error: Check SQL Permissions</option>';
            return;
        }

        if (data) {
            dropdown.innerHTML = '<option value="">-- Select a Table --</option>';
            data.forEach(t => {
                const opt = document.createElement('option');
                opt.value = t.table_name;
                opt.innerText = t.table_name;
                dropdown.appendChild(opt);
            });
        }
    }

    async function loadTableData(tableName) {
        if (!tableName) return;
        const head = document.getElementById('tHead');
        const body = document.getElementById('tBody');
        const countBadge = document.getElementById('recordCount');

        body.innerHTML = '<tr><td class="text-center p-5"><i class="fas fa-sync fa-spin"></i> Loading Records...</td></tr>';

        // Fetch all rows from the selected table
        const { data, error } = await client.from(tableName).select('*');

        if (error) {
            alert("Access Denied: You need to disable RLS for this table or add a SELECT policy.");
            return;
        }

        if (data && data.length > 0) {
            const columns = Object.keys(data[0]);
            countBadge.innerText = `${data.length} Records Found`;
            countBadge.classList.remove('d-none');
            
            head.innerHTML = `<tr>${columns.map(c => `<th>${c}</th>`).join('')}</tr>`;
            body.innerHTML = data.map(row => `
                <tr>${columns.map(c => `<td>${row[c] !== null ? row[c] : '-'}</td>`).join('')}</tr>
            `).join('');
        } else {
            body.innerHTML = '<tr><td class="p-5 text-center text-muted">Table is empty. No records found.</td></tr>';
            countBadge.classList.add('d-none');
        }
    }

    window.onload = loadTableList;
</script>
</body>
</html>

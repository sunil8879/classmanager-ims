<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Explorer | ClassManager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --aqua: #7FFFD4; --black: #000000; --white: #FFFFFF; }
        body { background-color: var(--black); color: var(--white); font-family: sans-serif; text-align: left; margin: 0; }
        .header-bar { border-bottom: 3px solid var(--aqua); padding: 15px; background: #000; position: sticky; top: 0; z-index: 100; }
        .table-selector { background: #111; border: 2px solid var(--aqua); border-radius: 10px; color: var(--aqua); padding: 12px; width: 100%; font-weight: bold; }
        th { background: var(--aqua) !important; color: black !important; text-transform: uppercase; font-size: 11px; padding: 10px !important; }
        td { font-size: 13px; border-color: #333 !important; color: white !important; white-space: nowrap; padding: 8px !important; }
        #debug-status { color: #ffc107; font-size: 11px; margin-top: 5px; }
        .table-responsive { max-height: 75vh; border: 1px solid var(--aqua); border-radius: 10px; margin-top: 20px; }
    </style>
</head>
<body>

<div class="header-bar">
    <h5 class="fw-bold text-uppercase m-0" style="color: var(--aqua);">🗄️ DATABASE EXPLORER</h5>
    <div id="debug-status">Initializing Cloudflare Bridge...</div>
</div>

<div class="container-fluid py-3">
    <div class="row g-3">
        <div class="col-12">
            <label class="text-aqua small fw-bold mb-1">SELECT TABLE</label>
            <select id="tableDropdown" class="table-selector" onchange="loadTableData(this.value)">
                <option value="">-- Loading Tables... --</option>
            </select>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-dark table-hover mb-0">
            <thead id="tHead"></thead>
            <tbody id="tBody">
                <tr><td class="p-5 text-center text-muted">Select a table to see live records.</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // 1. YOUR DETAILS
    const WORKER_URL = 'https://classmanager-api.sunilvasarkar1975.workers.dev';
    const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVyendpam5sYm53amRsbHV2eHlrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEyNTkzMDgsImV4cCI6MjA4NjgzNTMwOH0.H8c9tT5HsxeL4xJAM9KrKmb1v6KKO8dZ-NOB-Pz2G2k';

    // 2. GET ID (With fallback for GoDaddy/Mobile Iframe issues)
    let myID = localStorage.getItem('institute_id') || sessionStorage.getItem('institute_id');
    if (!myID || myID === "null") {
        myID = prompt("GoDaddy Security: Please enter your Institute ID manually:");
    }

    const headers = {
        "apikey": ANON_KEY,
        "Authorization": "Bearer " + ANON_KEY,
        "Content-Type": "application/json"
    };

    async function init() {
        const status = document.getElementById('debug-status');
        const dropdown = document.getElementById('tableDropdown');
        try {
            // RPC calls (get-table-list) MUST be POST
            const res = await fetch(`${WORKER_URL}/get-table-list`, { 
                method: 'POST', 
                headers: headers 
            });
            const tables = await res.json();

            dropdown.innerHTML = '<option value="">-- Select Table --</option>';
            tables.forEach(t => {
                const name = t.table_name || t.relname || t;
                dropdown.innerHTML += `<option value="${name}">${name}</option>`;
            });
            status.innerText = "✅ Connected to: " + myID;
        } catch (err) {
            status.innerText = "❌ Connection Failed. Check Worker URL and Anon Key.";
            console.error(err);
        }
    }

    async function loadTableData(tableName) {
        if (!tableName) return;
        const body = document.getElementById('tBody');
        const head = document.getElementById('tHead');
        body.innerHTML = '<tr><td class="p-5 text-center">Syncing...</td></tr>';

        try {
            // Table data is a GET request
            const res = await fetch(`${WORKER_URL}/get-table-data?table=${tableName}`, { headers: headers });
            const data = await res.json();

            if (!data || data.length === 0) {
                body.innerHTML = '<tr><td class="p-5 text-center">Table is empty.</td></tr>';
                return;
            }

            const cols = Object.keys(data[0]);
            const filtered = data.filter(r => String(r.institute_id) === String(myID));

            if (filtered.length > 0) {
                head.innerHTML = `<tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr>`;
                body.innerHTML = filtered.map(r => `<tr>${cols.map(c => `<td>${r[c] !== null ? r[c] : '-'}</td>`).join('')}</tr>`).join('');
            } else {
                body.innerHTML = `<tr><td class="p-5 text-center">0 records match ID: ${myID}</td></tr>`;
            }
        } catch (err) {
            alert("Fetch error: " + err.message);
        }
    }
    window.onload = init;
</script>
</body>
</html>

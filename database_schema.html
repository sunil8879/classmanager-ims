<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Explorer | ClassManager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --aqua: #7FFFD4; --black: #000000; --white: #FFFFFF; }
        body { background-color: var(--black); color: var(--white); font-family: sans-serif; text-align: left; margin: 0; }
        .header-bar { border-bottom: 3px solid var(--aqua); padding: 15px; background: #000; position: sticky; top: 0; z-index: 100; }
        .table-selector { background: #111; border: 2px solid var(--aqua); border-radius: 10px; color: var(--aqua); padding: 12px; width: 100%; font-weight: bold; }
        th { background: var(--aqua) !important; color: black !important; text-transform: uppercase; font-size: 11px; padding: 10px !important; }
        td { font-size: 13px; border-color: #333 !important; color: white !important; white-space: nowrap; padding: 8px !important; }
        #debug-status { color: #ffc107; font-size: 11px; margin-top: 5px; }
        .table-responsive { max-height: 75vh; border: 1px solid var(--aqua); border-radius: 10px; margin-top: 20px; }
    </style>
</head>
<body>

<div class="header-bar">
    <h5 class="fw-bold text-uppercase m-0" style="color: var(--aqua);">🗄️ DATABASE EXPLORER</h5>
    <div id="debug-status">Initializing Cloudflare Bridge...</div>
</div>

<div class="container-fluid py-3">
    <div class="row g-3">
        <div class="col-12">
            <label class="text-aqua small fw-bold mb-1">SELECT TABLE</label>
            <select id="tableDropdown" class="table-selector" onchange="loadTableData(this.value)">
                <option value="">-- Loading Tables... --</option>
            </select>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-dark table-hover mb-0">
            <thead id="tHead"></thead>
            <tbody id="tBody">
                <tr><td class="p-5 text-center text-muted">Select a table to see live records.</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // 1. SETTINGS (PASTE YOUR URL HERE)
    const WORKER_URL = 'https://your-worker-name.workers.dev'; 

    // 2. SMART ID FINDER (Tries all possible names used in your app)
    const myID = localStorage.getItem('institute_id') || 
                 sessionStorage.getItem('institute_id') || 
                 localStorage.getItem('tenant_id') || 
                 'OWNER'; // Fallback if still not found

    async function init() {
        const status = document.getElementById('debug-status');
        const dropdown = document.getElementById('tableDropdown');

        status.innerText = "Attempting to fetch table list...";

        try {
            // Fetch tables from your Cloudflare Worker
            const res = await fetch(`${WORKER_URL}/get-table-list`);
            const tables = await res.json();

            if (tables.error) throw new Error(tables.error);

            dropdown.innerHTML = '<option value="">-- Select Table --</option>';
            tables.forEach(t => {
                const name = t.table_name || t.relname || t;
                dropdown.innerHTML += `<option value="${name}">${name}</option>`;
            });

            status.innerText = `✅ Connected. Logged in as: ${myID}`;
            status.style.color = "#7FFFD4";
        } catch (err) {
            status.innerText = "❌ Connection Failed. Check Worker URL or Internet.";
            console.error(err);
        }
    }

    async function loadTableData(tableName) {
        if (!tableName) return;
        
        const head = document.getElementById('tHead');
        const body = document.getElementById('tBody');
        const status = document.getElementById('debug-status');

        head.innerHTML = "";
        body.innerHTML = '<tr><td class="p-5 text-center"><div class="spinner-border text-info"></div><br>Syncing...</td></tr>';

        try {
            // Fetch actual rows from Worker
            const response = await fetch(`${WORKER_URL}/get-table-data?table=${tableName}`);
            const data = await response.json();

            if (!data || data.length === 0) {
                body.innerHTML = '<tr><td class="p-5 text-center text-muted">Table is empty.</td></tr>';
                return;
            }

            // FILTER: If table has 'institute_id', only show your records
            const cols = Object.keys(data[0]);
            let filteredRows = data;
            
            if (cols.includes('institute_id') && myID !== 'OWNER') {
                filteredRows = data.filter(row => String(row.institute_id) === String(myID));
            }

            if (filteredRows.length > 0) {
                head.innerHTML = `<tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr>`;
                body.innerHTML = filteredRows.map(row => `
                    <tr>${cols.map(c => `<td>${row[c] !== null ? row[c] : '-'}</td>`).join('')}</tr>
                `).join('');
                status.innerText = `Viewing ${tableName} (${filteredRows.length} records)`;
            } else {
                body.innerHTML = `<tr><td class="p-5 text-center text-warning">Table has data, but none match ID: ${myID}</td></tr>`;
            }
        } catch (err) {
            body.innerHTML = `<tr><td class="p-5 text-center text-danger">Error: ${err.message}</td></tr>`;
        }
    }

    window.onload = init;
</script>
</body>
</html>
